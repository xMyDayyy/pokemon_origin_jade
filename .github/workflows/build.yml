name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jade:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Origin Jade)
        shell: bash
        run: make -O -j$(nproc)

      - name: SHA-1
        shell: bash
        run: sha1sum Pokemon_Origin_Jade.gba | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Flags and vars
        run: python3 tools/check_flags.py

      - name: Species per region and Pokedex order (D-049)
        run: python3 -I tools/check_regions.py

      - name: Debug states up to date
        run: python3 tools/make_debug_states.py --check

      - name: Save and memory budget
        shell: bash
        run: |
          python3 tools/check_budget.py | tee budget.txt
          { echo '```'; cat budget.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"


  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Release ROM (Origin Jade)
        run: make -O -j$(nproc) release

      - name: SHA-1
        shell: bash
        run: sha1sum Pokemon_Origin_Jade-release.gba | tee -a "$GITHUB_STEP_SUMMARY"

  # Gate job: satisfies the "build" branch protection rule.
  build:
    runs-on: ubuntu-24.04
    needs: [jade, release]
    steps:
      - name: All builds passed
        run: echo "All builds and checks passed."
